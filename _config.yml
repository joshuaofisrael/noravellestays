# GitHub Pages builds this repo with Jekyll. Default excludes only drop
# dotfiles, underscore paths, and a few vendor directories, so this key is
# not excluded. List it anyway so the IndexNow file is always copied to the
# site root.
include:
  - .htaccess
  - 42e02e542760c2759c8f9a64e88f0f10.txt
  - llms.txt

# Setting exclude replaces the Jekyll defaults, so the defaults are repeated.
# drafts, content-review, scripts, and tests must not be in the published site.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - drafts/
  - content-review/
  - scripts/
  - tests/
